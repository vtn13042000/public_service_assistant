# SearxNG settings for AI5013 (self-hosted metasearch; the web tool's first backend, src/tools/web.py).
# Starts from the image's defaults and changes only what is listed here.
use_default_settings:
  engines:
    # a small, general-web set; everything else in the default list is dropped
    keep_only: [duckduckgo, bing, google, brave, startpage, mojeek]

general:
  instance_name: "AI5013 SearxNG (local)"
  enable_metrics: false

server:
  # secret_key comes from SEARXNG_SECRET (repo-root .env, generated by infra/searxng/up.sh)
  limiter: false          # local single-user instance: no bot limiter for 127.0.0.1
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0          # off: procedure terms (e.g. "khai tử") must not be filtered
  autocomplete: ""
  default_lang: "vi-VN"
  formats: [html, json]   # JSON API used by src/tools/web.py

outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0

engines:
  # bing and google are disabled in the upstream defaults; enable them here
  - name: bing
    disabled: false
  - name: google
    disabled: false
