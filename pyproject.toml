[project]
name = "ai5013"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "datasets>=5.1.0",
    "ddgs>=9.16.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "langchain>=1.4.4",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.9",
    "langchain-ollama>=1.1.0",
    "langfuse>=4.17.0",
    "langgraph>=1.2.14",
    "lxml>=6.1.3",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.0",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
markers = [
    "ollama: needs local Ollama (bge-m3 / qwen) at 127.0.0.1:11434",
    "network: needs internet access",
]
